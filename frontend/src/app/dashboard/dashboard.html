<div class="min-h-screen bg-slate-50">
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
    <h1 class="text-lg font-semibold text-slate-900">Hospital Dashboard</h1>
    <div class="flex items-center gap-4">
        @if (auth.user(); as user) {
        <span class="text-sm text-slate-600">{{ user.username }} · {{ user.role }}</span>
        }
        <app-logout-button />
    </div>
    </header>
    <main class="p-6">
    <p class="text-slate-600 mb-4">You are signed in.</p>
    <div class="flex gap-3">
      @if (auth.user()?.role === 'ADMIN') {
        <a
          routerLink="/admin"
          class="inline-block rounded-lg bg-blue-600 text-white text-sm font-medium px-4 py-2 hover:bg-blue-700"
        >
          Open admin panel
        </a>
      }
      @if (auth.user()?.role === 'PATIENT') {
        <a
          routerLink="/chat"
          class="inline-block rounded-lg bg-blue-600 text-white text-sm font-medium px-4 py-2 hover:bg-blue-700"
        >
          Chat with a doctor
        </a>
      }
      @if (auth.user()?.role === 'DOCTOR') {
        <a
          routerLink="/doctor/chat"
          class="inline-block rounded-lg bg-blue-600 text-white text-sm font-medium px-4 py-2 hover:bg-blue-700"
        >
          Patient chat
        </a>
      }
    </div>
    </main>
</div>
