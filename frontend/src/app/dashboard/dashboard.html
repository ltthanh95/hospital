<div>
  <div class="mb-5">
    <h2 class="text-xl font-semibold text-slate-900 mb-1">Hospital Dashboard</h2>
    @if (auth.user(); as user) {
      <p class="text-slate-600">Welcome back, {{ user.username }}.</p>
    }
  </div>

  @switch (auth.user()?.role) {
    @case ('PATIENT') {
      <app-patient-dashboard />
    }
    @case ('DOCTOR') {
      <app-doctor-dashboard />
    }
    @case ('ADMIN') {
      <app-admin-dashboard />
    }
  }
</div>
