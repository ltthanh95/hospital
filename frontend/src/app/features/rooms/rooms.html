<div class="max-w-3xl">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-slate-900">Rooms</h2>
    <button
      (click)="refresh()"
      class="rounded-lg border border-slate-300 text-sm font-medium px-3 py-1.5 text-slate-600 hover:bg-slate-100"
    >
      Refresh
    </button>
  </div>

  @if (errorMessage()) {
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-slate-500">
        <tr>
          <th class="px-4 py-2 font-medium">Room #</th>
          <th class="px-4 py-2 font-medium">Type</th>
          <th class="px-4 py-2 font-medium">Capacity</th>
          <th class="px-4 py-2 font-medium">Occupancy</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (room of rooms(); track room.id) {
          <tr>
            <td class="px-4 py-2 text-slate-900">{{ room.roomNumber }}</td>
            <td class="px-4 py-2 text-slate-600">{{ room.type }}</td>
            <td class="px-4 py-2 text-slate-600">{{ room.capacity }}</td>
            <td class="px-4 py-2 text-slate-600">
              <span
                class="rounded-full px-2 py-0.5 text-xs font-medium"
                [class.bg-red-50]="room.currentOccupancy >= room.capacity"
                [class.text-red-700]="room.currentOccupancy >= room.capacity"
                [class.bg-emerald-50]="room.currentOccupancy < room.capacity"
                [class.text-emerald-700]="room.currentOccupancy < room.capacity"
              >
                {{ room.currentOccupancy }} / {{ room.capacity }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-4 py-6 text-center text-slate-400">
              {{ loading() ? 'Loading...' : 'No rooms yet.' }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
