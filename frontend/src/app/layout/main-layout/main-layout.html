<div class="h-screen flex flex-col bg-slate-50">
  <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3 shrink-0">
    <div class="flex items-center gap-2">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white text-sm font-bold">
        H
      </span>
      <h1 class="text-lg font-semibold text-slate-900">Hospital</h1>
    </div>
    <div class="flex items-center gap-4">
      @if (auth.user(); as user) {
        <span class="text-sm text-slate-600">
          {{ user.username }}
          <span class="ml-1 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500">
            {{ user.role }}
          </span>
        </span>
      }
      <app-logout-button />
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <nav class="w-56 shrink-0 overflow-y-auto border-r border-slate-200 bg-white py-4">
      <ul class="flex flex-col gap-0.5 px-3">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-blue-50 text-blue-700"
              class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>

  <app-chat-bubble />
</div>
