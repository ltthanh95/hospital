<div>
  @if (errorMessage()) {
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
      {{ errorMessage() }}
    </div>
  }

  @if (loading()) {
    <p class="text-slate-400">Loading...</p>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <p class="text-sm text-slate-500">Today's appointments</p>
        <p class="mt-1 text-2xl font-semibold text-slate-900">{{ todayCount() }}</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <p class="text-sm text-slate-500">Upcoming appointments</p>
        <p class="mt-1 text-2xl font-semibold text-slate-900">{{ upcomingCount() }}</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <p class="text-sm text-slate-500">Patients under your care</p>
        <p class="mt-1 text-2xl font-semibold text-slate-900">{{ totalPatients() }}</p>
      </div>
    </div>

    <app-appointment-calendar
      [events]="calendarEvents()"
      emptyLabel="No appointments scheduled on this day."
    />
  }
</div>
